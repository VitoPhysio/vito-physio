name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor Android plugins
        run: |
          mkdir -p android/app/src/main/assets
          pnpm exec cap sync android

      - name: Calculate Android version code
        run: echo "VITO_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PVITO_VERSION_CODE="$VITO_VERSION_CODE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vito-physio-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/Vito-physio.apk
          if-no-files-found: error
